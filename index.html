<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b14">

    <title>Jostycoon | Official Profil</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- Background -->
    <div class="background-overlay"></div>

    <!-- Animated Particles -->
    <canvas id="particles"></canvas>

    <main class="container">

        <section class="profile-card">

            <!-- Banner -->
            <div class="banner">
                <div class="banner-overlay"></div>
            </div>

            <!-- Profile -->
            <div class="profile-image">
                <img src="image/profil.jpg" alt="Jostycoon">
            </div>

            <div class="profile-info">

                <h1>Jostycoon</h1>

                <div class="verified">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Official</span>
                </div>

                <p class="description">
                    Selamat datang di website profil media sosial Jostycoon.</p>                </p>

            </div>

            <!-- Social Media -->
            <section class="social-section">

                <h2>CONNECT WITH ME</h2>

                <div class="social-links">

                    <a href="https://youtube.com/@Jostycoon"
                       target="@Jostycoon"
                       rel="noopener noreferrer"
                       class="social-link youtube">

                        <div class="social-icon">
                            <i class="fa-brands fa-youtube"></i>
                        </div>

                        <span>YouTube</span>
                        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                    </a>

                    <a href="https://tiktok.com/@josetycoon"
                       target="@josetycoon"
                       rel="noopener noreferrer"
                       class="social-link tiktok">

                        <div class="social-icon">
                            <i class="fa-brands fa-tiktok"></i>
                        </div>

                        <span>TikTok</span>
                        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                    </a>

                    <a href="https://github.com/jostycoon"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="social-link github">

                        <div class="social-icon">
                            <i class="fa-brands fa-github"></i>
                        </div>

                        <span>GitHub</span>
                        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                    </a>


                 <a href="https://wa.me/62882003033650"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-link whatsapp">

                 <div class="social-icon">
                    <i class="fa-brands fa-whatsapp"></i>
                 </div>

                   <span>WhatsApp</span>
                   <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                 </a>

                </div>
            </section>

            <footer>
                <p>© <span id="year"></span> Jostycoon</p>
                <span>Designed with core</span>
            </footer>

        </section>

    </main>

    <!-- Music Player -->
    <div class="music-player">

        <audio id="backgroundMusic" loop preload="none">
            <source src="assets/music.mp3" type="audio/mpeg">
        </audio>

        <button id="musicToggle" class="music-button"
                aria-label="Play music">
            <i class="fa-solid fa-play"></i>
        </button>

        <div class="music-details">
            <span>BACKGROUND MUSIC</span>
            <input
                type="range"
                id="volumeControl"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                aria-label="Volume"
            >
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
